context:
  component_name: transport
  repo_name: gz-${{ component_name }}
  version: "15.0.2"
  major_version: 15
  name: ${{ repo_name }}
  component_version: ${{ component_name }}${{ major_version }}
  cxx_name: lib${{ name }}
  python_name: ${{ name }}-python
  python_min: "3.12"
  python_max: "3.13"
  protobuf_version: "6.33.5"
  # osx-arm64
  libabseil_version: ">=20260107.0,<20260108.0a0"
  libzenohc_version: ">=1.9.0,<1.9.1.0a0"
  zeromq_version: ">=4.3.5,<4.4.0a0"


recipe:
  name: ${{ name }}
  version: ${{ version }}

source:
  - url: https://github.com/gazebosim/${{ repo_name }}/archive/${{ repo_name }}${{ major_version }}_${{ version }}.tar.gz
    sha256: c8483883f6dae93e154c1d189962f5dea0ca88c846a1463f16bb80063ec39b0f

build:
  number: 0

outputs:
  - package:
      name: ${{ cxx_name }}
    build:
      script:
        - if: unix
          then: build_cxx.sh
        - if: win
          then: bld_cxx.bat
    requirements:
      ignore_run_exports:
        by_name:
          - python >=${{ python_min }},<${{ python_max }}
          - python_abi [version = "==3.12", build = "*_cp312"]
        from_package:
          - python >=${{ python_min }},<${{ python_max }}
          - python_abi [version = "==3.12", build = "*_cp312"]
          - if: build_platform != target_platform
            then:
              - cross-python_${{ target_platform }}
      build:
        - ${{ compiler('cxx') }}
        - ${{ compiler('c') }}
        #- ${{ stdlib("c") }}
        - ninja
        - cmake
        - pkg-config
        - if: build_platform != target_platform
          then:
            - python >=${{ python_min }},<${{ python_max }}
            - python_abi [version = "==3.12", build = "*_cp312"]
            - cross-python_${{ target_platform }}
      host:
        - python >=${{ python_min }},<${{ python_max }}
        - python_abi [version = "==3.12", build = "*_cp312"]
        - libgz-cmake
        - libgz-msgs
        - libgz-tools
        - libgz-utils
        - cppzmq
        - zeromq ${{ zeromq_version }}
        - libzenohc ${{ libzenohc_version }}
        - libzenohcxx
        - if: linux
          then:
            - libuuid
        - libabseil ${{ libabseil_version }}
        - libprotobuf ${{ protobuf_version }}.*
        - sqlite
      run:
        - cppzmq
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/include/gz/${{ component_version }}/gz/${{ component_name }}.hh
              - test -f ${PREFIX}/lib/cmake/${{ name }}/${{ name }}-config.cmake
          - if: linux
            then:
              - test -f ${PREFIX}/lib/lib${{ name }}.so
          - if: osx
            then:
              - test -f ${PREFIX}/lib/lib${{ name }}.dylib
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\gz\\${{ component_version }}\\gz\\${{ component_name }}.hh exit 1
              - if not exist %PREFIX%\\Library\\lib\\${{ name }}.lib exit 1
              - if not exist %PREFIX%\\Library\\bin\\${{ name }}.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\${{ name }}\\${{ name }}-config.cmake exit 1

  - package:
      name: ${{ python_name }}
    build:
      script:
        - if: unix
          then: build_py.sh
        - if: win
          then: bld_py.bat
    requirements:
      build:
        - ${{ compiler('c') }}
        #- ${{ stdlib("c") }}
        - ${{ compiler('cxx') }}
        - ninja
        - cmake
        - pkg-config
        - if: build_platform != target_platform
          then:
            - python >=${{ python_min }},<${{ python_max }}
            - python_abi [version = "==3.12", build = "*_cp312"]
            - cross-python_${{ target_platform }}
            - pybind11
            - pybind11-abi
            - pytest
      host:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - python >=${{ python_min }},<${{ python_max }}
        - python_abi [version = "==3.12", build = "*_cp312"]
        - pybind11
        - pybind11-abi
        - pytest
        - gz-msgs-python
        # We depend on gz-msgs to ensure that the version of gz-msgs and gz-msgs-python are compatible
        - gz-msgs
        # Workaround for errors of type
        # package libgz-sim7-<..> requires <...>, but none of the providers can be installed
        - libabseil ${{ libabseil_version }}
        - libprotobuf ${{ protobuf_version }}.*
        - libgz-msgs
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - python >=${{ python_min }}
        - gz-msgs-python
        # We depend on gz-msgs to ensure that the version of gz-msgs and gz-msgs-python are compatible
        - gz-msgs
    tests:
      - python:
          imports:
            - gz.transport

  - package:
      name: ${{ name }}
    requirements:
      run:
        - ${{ pin_subpackage(cxx_name, exact=True) }}
        - ${{ pin_subpackage(python_name, upper_bound='x.x.x') }}
      run_exports:
        - ${{ pin_subpackage(cxx_name, upper_bound='x') }}
    tests:
      - script:
          - if: not win
            then:
              - test -f ${PREFIX}/include/gz/${{ component_version }}/gz/${{ component_name }}.hh
              - test -f ${PREFIX}/lib/cmake/${{ name }}/${{ name }}-config.cmake
          - if: linux
            then:
              - test -f ${PREFIX}/lib/lib${{ name }}.so
          - if: osx
            then:
              - test -f ${PREFIX}/lib/lib${{ name }}.dylib
          - if: win
            then:
              - if not exist %PREFIX%\\Library\\include\\gz\\${{ component_version }}\\gz\\${{ component_name }}.hh exit 1
              - if not exist %PREFIX%\\Library\\lib\\${{ name }}.lib exit 1
              - if not exist %PREFIX%\\Library\\bin\\${{ name }}.dll exit 1
              - if not exist %PREFIX%\\Library\\lib\\cmake\\${{ name }}\\${{ name }}-config.cmake exit 1
      - python:
          imports:
            - gz.transport

about:
  homepage: https://github.com/gazebosim/${{ repo_name }}
  license: Apache-2.0
  license_file: LICENSE
  summary: Transport library for component communication based on publication/subscription and service calls.

extra:
  feedstock-name: ${{ repo_name }}
  recipe-maintainers:
    - wolfv
    - traversaro
    - j-rivero
